<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | SV Property & Township</title>
  <link rel="stylesheet" href="assets/css/luxury-realestate.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    .thank-you-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.12) 0%, #080c14 70%);
    }
    .thank-you-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 50px 36px;
      max-width: 580px;
      width: 100%;
      box-shadow: var(--shadow-lg), 0 0 50px rgba(212, 175, 55, 0.2);
    }
    .thank-you-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid var(--emerald-accent);
      color: var(--emerald-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 24px;
      animation: scale-in 0.5s ease;
    }
    .thank-you-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .thank-you-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>
  <div class="thank-you-page">
    <div class="thank-you-card">
      <div class="thank-you-icon">
        <i class="fas fa-check"></i>
      </div>
      <h1 class="thank-you-title">Inquiry Received!</h1>
      <p class="thank-you-desc">
        Thank you for connecting with <strong class="text-gold">SV Property & Township</strong>. Our senior real estate advisor will call you within 15 minutes to share plot master plans, price sheets, and arrange your free VIP site visit.
      </p>

      <div class="action-group">
        <a id="wa-instant-btn" href="https://wa.me/919625608176?text=Hi%20SV%20Property%20Team%2C%20I%20just%20submitted%20an%20inquiry.%20Please%20send%20me%20the%20Jewar%20plots%20brochure%20and%20location%20map." target="_blank" class="btn-whatsapp" style="width: 100%;">
          <i class="fab fa-whatsapp"></i> Chat on WhatsApp Now
        </a>

        <a href="tel:+919625608176" class="btn-outline" style="width: 100%;">
          <i class="fas fa-phone-alt"></i> Call Directly: +91 96256 08176
        </a>

        <a href="index.htm" class="nav-link" style="margin-top: 10px; display: inline-block;">
          <i class="fas fa-arrow-left"></i> Return to Homepage
        </a>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name') || '';
    const project = urlParams.get('project') || 'SV Township Plots';
    if (name) {
      const waBtn = document.getElementById('wa-instant-btn');
      const text = encodeURIComponent(`Hi SV Property Team, I submitted an inquiry for ${project}. My Name is ${name}. Please share the brochure and location map.`);
      waBtn.href = `https://wa.me/919625608176?text=${text}`;
    }
  </script>
</body>
</html>
